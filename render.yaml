services:
  - type: web
    name: supachef
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /images/*
        name: Cache-Control
        value: public, max-age=3600, stale-while-revalidate=86400
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
